<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real time content Retriever</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Start of spinner -->
        <div class="spinner-overlay">
            <div class="spinner"></div>
            <p>Loading Content...</p>
        </div>
    <!-- End of spinner -->

    <!-- Start of header section -->
    <header>
        <section class="wrapper header-content">
            <h1>The Reading Room</h1>
            <div class="profile"> </div>
        </section>
    </header>
    <!-- End of header section -->
    
    
    <!-- Start of main section -->
    <main class="wrapper container">
        
        <section class="left-section">
            <!-- Video section -->
            <section class="video-container"> </section>

            <div class="line"></div>

            <!-- Comments section -->
            <section class="comment-container"> 
                <p class="title">Comments</p>
            </section>
        </section>

        <section class="image-section"> 
            <p class="title">You might also like</p>
        </section>
    </main>
    <!-- End of main section -->
    
    <!-- Start of footer section -->
    <footer>
        <section class="wrapper footer-content">
            <p> &copy; Copyrights 2026 </p>
            <p>THE READING ROOM</p>
        </section>

        <button class="chat-button">
            <img src="./assets/chatting 1.png" alt="Chat Logo" class="chat-icon"/>
        </button>
    </footer>
    <!-- End of footer section -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
