<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/5b41ffab35.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Start of Header Section -->
    <header>
        <h1>Play & Learn</h1>
        <div class="icons">
            <i class="fa-solid fa-volume-high"></i>
            <i class="fa-solid fa-gear"></i>
        </div>
    </header>
    <!-- End of Header Section -->
    
    <main>
        <!-- Start of Home Page Section -->
        <section class="home-page" id="page1">
            <div class="heading">1. Choose a Shape</div>
            <div class="shapes">
                <!-- Form using object in script -->
                <div class="circle" id="circle"></div>
                <div class="triangle" id="triangle"></div>
                <div class="square" id="square"></div>
            </div>
            <button class="next" id="nextBtn">Next</button>
        </section>
        <!-- End of Home Page Section -->
        
        <!-- Start of Input Page Section -->
        <section class="input-page" id="page2">
            <div class="heading" id="side">2. Enter Side</div>
            <div class="heading" id="radius">2. Enter Radius</div>
            <input type="number" id="inputValue" value="5">
            <div class="btns">
                <button class="input-btn" id="backBtn">Back</button>
                <button class="input-btn" id="calcBtn">Calculate</button>
            </div>
        </section>
        <!-- End of Input Page Section -->

        <section class="result-page" id="page3"></section>
        <script src="script.js"></script>
    </main>
</body>
</html>
